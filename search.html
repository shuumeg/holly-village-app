<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Work Navi | 地域包括支援センター検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/swnavi-icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="assets/swnavi-icon-512.png">
<meta name="theme-color" content="#ffffff">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="app-header__back">← ホーム</a>
    <h1 class="app-logo"><span class="app-logo__bold">Social Work</span><span class="app-logo__light">Navi</span></h1>
    <p class="app-feature-tag">地域包括支援センター検索</p>
    <p class="subtitle">郵便番号または住所から、担当の地域包括支援センターを調べられます</p>
  </header>

  <main class="app-main">
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="例：194-0021 または 町田市中町"
          autocomplete="off"
          inputmode="search"
        >
        <button type="submit" class="search-button">検索</button>
      </form>
      <p class="search-hint">郵便番号（ハイフンあり／なし）、または「市区町村＋町名」で検索できます</p>
    </section>

    <section id="results" class="results" aria-live="polite">
      <p class="results-placeholder">郵便番号または住所を入力して検索してください。</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>※各センターの情報は自治体公式ページをもとに作成していますが、統廃合・移転等により変更されている場合があります。最新情報は各センターまたは自治体にご確認ください。</p>
    <p class="app-footer__copyright">© 2026 Social Work Navi. All Rights Reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
