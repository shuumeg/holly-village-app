<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地域包括支援センター検索</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<meta name="theme-color" content="#1f3a52">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="app-header__back">← Holly Village</a>
    <h1>地域包括支援センター検索</h1>
    <p class="subtitle">郵便番号または住所から、担当の地域包括支援センターを調べられます</p>
  </header>

  <main class="app-main">
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="例：194-0021 または 町田市中町"
          autocomplete="off"
          inputmode="search"
        >
        <button type="submit" class="search-button">検索</button>
      </form>
      <p class="search-hint">郵便番号（ハイフンあり／なし）、または「市区町村＋町名」で検索できます</p>
    </section>

    <section id="results" class="results" aria-live="polite">
      <p class="results-placeholder">郵便番号または住所を入力して検索してください。</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>※各センターの情報は自治体公式ページをもとに作成していますが、統廃合・移転等により変更されている場合があります。最新情報は各センターまたは自治体にご確認ください。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
